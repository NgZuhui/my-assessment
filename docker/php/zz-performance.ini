; The project is bind-mounted from Windows (9p filesystem), where every file stat is very slow.
; Re-checking thousands of vendor files on each request made every API call take ~4s.
opcache.enable=1
opcache.validate_timestamps=1
; Edits to PHP files are picked up within this many seconds (restart the app container for instant reload).
opcache.revalidate_freq=60
opcache.max_accelerated_files=20000
opcache.memory_consumption=256
realpath_cache_size=16M
realpath_cache_ttl=600
