services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/zz-performance.ini:/usr/local/etc/php/conf.d/zz-performance.ini:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - product-network

  db:
    image: mysql:8.0
    container_name: product-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: product_management
      MYSQL_USER: product_user
      MYSQL_PASSWORD: product_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - product-network

  nginx:
    image: nginx:alpine
    container_name: product-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - product-network

volumes:
  mysql-data:

networks:
  product-network:
    driver: bridge